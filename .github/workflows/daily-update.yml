name: 每日自动更新配件价格
on:
  # 兜底定时：每 2 小时一个时刻（共 9 个，覆盖北京时间 06:01~22:01），
  # 任一时刻被丢都能在 2 小时内补上。
  schedule:
    - cron: "1 22 * * *"  # 北京时间 06:01
    - cron: "1 0 * * *"   # 北京时间 08:01
    - cron: "1 2 * * *"   # 北京时间 10:01
    - cron: "1 4 * * *"   # 北京时间 12:01
    - cron: "1 6 * * *"   # 北京时间 14:01
    - cron: "1 8 * * *"   # 北京时间 16:01
    - cron: "1 10 * * *"  # 北京时间 18:01
    - cron: "1 12 * * *"  # 北京时间 20:01
    - cron: "1 14 * * *"  # 北京时间 22:01
    - cron: "38 15 * * *"  # 临时验证：北京时间 23:38
  # 支持手动触发测试
  workflow_dispatch:

# 赋予仓库写入权限（必须）
permissions:
  contents: write

jobs:
  update-price:
    # 固定 Ubuntu 24.04：ubuntu-latest 将迁移到 Ubuntu 26，固定版本避免环境突变
    runs-on: ubuntu-24.04
    steps:
      # checkout/setup-python 均用基于 Node 24 的新版，消除 Node 20 弃用警告
      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 fuzzywuzzy python-Levenshtein

      - name: 运行价格更新脚本
        run: python update_prices.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JD_APP_KEY: ${{ secrets.JD_APP_KEY }}
          JD_APP_SECRET: ${{ secrets.JD_APP_SECRET }}

      - name: 提交并推送修改
        # 用原生 git 代替第三方 action，少一个 Node 20 依赖
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无价格变化，跳过提交"
          else
            git commit -m "自动更新配件实时价格"
            # 先变基到远端最新提交再推送，避免脚本运行期间远端新提交（如手动改价）导致 push 被拒；
            # 失败后重试 3 次，仍失败则步骤报错可见
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                break
              fi
              echo "第 $attempt 次推送失败，5 秒后重试"
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
