name: 每日自动更新配件价格
on:
  # 兜底定时：GitHub 定时队列在整点/半点前后负载最高，容易延迟甚至丢弃，
  # 分钟数统一错开到 13/17/43 等非峰值时刻，降低被丢概率
  schedule:
    - cron: "13 23 * * *"  # 北京时间 07:13 兜底
    - cron: "17 1 * * *"   # 北京时间 09:17 兜底
    - cron: "43 3 * * *"   # 北京时间 11:43 兜底
    - cron: "13 6 * * *"   # 北京时间 14:13 兜底
    - cron: "43 8 * * *"   # 北京时间 16:43 兜底
    - cron: "17 11 * * *"  # 北京时间 19:17 兜底
    - cron: "13 13 * * *"  # 北京时间 21:13 兜底
  # 支持手动触发测试
  workflow_dispatch:
  # 供本机定时器通过 API 触发
  repository_dispatch:
    types: [update-prices]

# 赋予仓库写入权限（必须）
permissions:
  contents: write

jobs:
  update-price:
    # 固定 Ubuntu 24.04：ubuntu-latest 将迁移到 Ubuntu 26，固定版本避免环境突变
    runs-on: ubuntu-24.04
    steps:
      # checkout/setup-python 均用基于 Node 24 的新版，消除 Node 20 弃用警告
      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 fuzzywuzzy python-Levenshtein

      - name: 运行价格更新脚本
        run: python update_prices.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JD_APP_KEY: ${{ secrets.JD_APP_KEY }}
          JD_APP_SECRET: ${{ secrets.JD_APP_SECRET }}

      - name: 提交并推送修改
        # 用原生 git 代替第三方 action，少一个 Node 20 依赖
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无价格变化，跳过提交"
          else
            git commit -m "自动更新配件实时价格"
            git push
          fi
