name: 每日自动更新配件价格
on:
  # 兜底定时：GitHub 定时队列常延迟数十分钟到数小时，准点由本机计划任务
  # 调用 repository_dispatch 触发（github-trigger-update.ps1，北京时间 06:17~22:17 每 2 小时）
  schedule:
    - cron: "1 23 * * *"   # 北京时间 07:01 兜底
    - cron: "1 1 * * *"    # 北京时间 09:01 兜底
    - cron: "31 3 * * *"   # 北京时间 11:31 兜底
    - cron: "1 6 * * *"    # 北京时间 14:01 兜底
    - cron: "31 8 * * *"   # 北京时间 16:31 兜底
    - cron: "1 11 * * *"   # 北京时间 19:01 兜底
  # 支持手动触发测试
  workflow_dispatch:
  # 供本机定时器通过 API 触发
  repository_dispatch:
    types: [update-prices]

# 赋予仓库写入权限（必须）
permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 fuzzywuzzy python-Levenshtein

      - name: 运行价格更新脚本
        run: python update_prices.py
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          JD_APP_KEY: ${{ secrets.JD_APP_KEY }} 
          JD_APP_SECRET: ${{ secrets.JD_APP_SECRET }}

      - name: 提交并推送修改
        uses: EndBug/add-and-commit@v9
        with:
          message: "自动更新配件实时价格"
          committer_name: GitHub Actions
          committer_email: actions@github.com
