name: 每日自动更新配件价格
on:
  # 定时触发：每天北京时间6:01起，每隔2小时一次，排除23:00~06:00
  # 北京时间 06:01 08:01 10:01 12:01 14:01 16:01 18:01 20:01 22:01
  # 对应 UTC   22:01 00:01 02:01 04:01 06:01 08:01 10:01 12:01 14:01
  schedule:
    - cron: "1 22 * * *"  # 北京时间 06:01
    - cron: "1 0 * * *"   # 北京时间 08:01
    - cron: "1 2 * * *"   # 北京时间 10:01
    - cron: "1 4 * * *"   # 北京时间 12:01
    - cron: "1 6 * * *"   # 北京时间 14:01
    - cron: "1 8 * * *"   # 北京时间 16:01
    - cron: "1 10 * * *"  # 北京时间 18:01
    - cron: "1 12 * * *"  # 北京时间 20:01
    - cron: "1 14 * * *"  # 北京时间 22:01
  # 支持手动触发测试
  workflow_dispatch:

# 赋予仓库写入权限（必须）
permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 fuzzywuzzy python-Levenshtein

      - name: 运行价格更新脚本
        run: python update_prices.py
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          JD_APP_KEY: ${{ secrets.JD_APP_KEY }} 
          JD_APP_SECRET: ${{ secrets.JD_APP_SECRET }}

      - name: 提交并推送修改
        uses: EndBug/add-and-commit@v9
        with:
          message: "自动更新配件实时价格"
          committer_name: GitHub Actions
          committer_email: actions@github.com
